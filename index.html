<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>🌿 Grow Simulator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ========== БАЗОВЫЕ ПЕРЕМЕННЫЕ ========== */
:root {
  --bg: #0d1a0d;
  --text: #e0e0e0;
  --hint: #8a9a8a;
  --button: #2e7d32;
  --button-text: #fff;
  --secondary: #1a2e1a;
  --accent: #4caf50;
  --danger: #e53935;
  --warning: #ffb300;
  --purple: #7b1fa2;
  --blue: #1e88e5;
  --soil: #3e2723;
  --pot-color: #5d4037;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 20px;
  overflow-x: hidden;
  background-image: 
    radial-gradient(ellipse at 20% 50%, rgba(46,125,50,0.15) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 50%, rgba(27,94,32,0.1) 0%, transparent 60%);
}

/* ========== ЗАГОЛОВОК ========== */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(13,26,13,0.92);
  backdrop-filter: blur(12px);
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(76,175,80,0.2);
}
.stats{display:flex;gap:12px;font-size:13px;font-weight:600;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,0.05);padding:4px 10px;border-radius:20px}
.stat span{color:var(--accent)}

/* ========== ТАБЫ ========== */
.tabs {
  display: flex;
  background: rgba(26,46,26,0.8);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  overflow-x: auto;
  padding: 4px 0;
}
.tab {
  flex: 1;
  min-width: 60px;
  padding: 10px 4px;
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  opacity: 0.5;
  transition: all 0.3s;
  border-bottom: 2px solid transparent;
}
.tab.active{opacity:1;border-bottom-color:var(--accent);color:var(--accent)}

/* ========== КОНТЕНТ ========== */
.content{padding:12px}.section{display:none}.section.active{display:block}

/* ========== ФЕРМА - СЕТКА ========== */
.farm-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

/* ========== ГОРШОК ========== */
.pot {
  background: linear-gradient(145deg, #1a2e1a, #0d1a0d);
  border-radius: 20px;
  padding: 14px 10px 12px;
  text-align: center;
  border: 1px solid rgba(76,175,80,0.15);
  position: relative;
  overflow: hidden;
  min-height: 240px;
  display: flex;
  flex-direction: column;
  align-items: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.pot::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 40%;
  background: linear-gradient(to top, var(--soil), transparent);
  border-radius: 0 0 20px 20px;
  opacity: 0.3;
}

/* ====== ГОРШОК СВЕЧЕНИЕ ====== */
.pot-glow {
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.8s ease;
  z-index: 0;
}
.pot-glow.active{opacity:0.25}
.glow-cfl{background:radial-gradient(circle,#ffeb3b 0%,transparent 70%)}
.glow-led{background:radial-gradient(circle,#4caf50 0%,transparent 70%)}
.glow-hps{background:radial-gradient(circle,#ff9800 0%,transparent 70%)}
.glow-quantum{background:radial-gradient(circle,#e040fb 0%,transparent 70%)}
.pot-glow.pulsing{animation:pulse-glow 2s ease-in-out infinite}
@keyframes pulse-glow{0%,100%{opacity:0.15}50%{opacity:0.35}}

/* ====== РАСТЕНИЕ (SVG) ====== */
.plant-container {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 120px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  margin-bottom: 4px;
}
.plant-container svg {
  width: 90px;
  height: 110px;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
  transition: all 0.5s ease;
}
.plant-container svg.ready {
  animation: sway 2s ease-in-out infinite;
}
@keyframes sway {
  0%, 100% { transform: rotate(-2deg); }
  50% { transform: rotate(2deg); }
}

/* ====== СТАТУСЫ ====== */
.pot-status{font-size:11px;color:var(--hint);margin:2px 0 4px;z-index:1;position:relative}
.pot-name{font-size:12px;font-weight:700;z-index:1;position:relative;color:#c8e6c9}

/* ====== БАРЫ ====== */
.bars{width:100%;display:flex;flex-direction:column;gap:2px;margin:4px 0;z-index:1;position:relative}
.bar-row{display:flex;align-items:center;gap:4px;font-size:9px}
.bar-row span{width:14px;font-size:10px}
.bar{flex:1;height:4px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width 0.5s ease}
.bar-fill.water{background:linear-gradient(90deg,#1565c0,#42a5f5)}
.bar-fill.health{background:linear-gradient(90deg,#2e7d32,#66bb6a)}
.bar-fill.light{background:linear-gradient(90deg,#f57f17,#ffb300)}

/* ====== КНОПКИ ====== */
.pot-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;z-index:1;position:relative;width:100%}
.btn {
  background: var(--button);
  color: var(--button-text);
  border: none;
  border-radius: 12px;
  padding: 7px 12px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 8px rgba(46,125,50,0.3);
}
.btn:active{transform:scale(0.95)}
.btn-secondary{background:rgba(255,255,255,0.08);color:var(--text);box-shadow:none}
.btn-blue{background:var(--blue);box-shadow:0 2px 8px rgba(30,136,229,0.3)}
.btn-warning{background:var(--warning);color:#111;box-shadow:0 2px 8px rgba(255,179,0,0.3)}
.btn-purple{background:var(--purple);box-shadow:0 2px 8px rgba(123,31,162,0.3)}
.btn-danger{background:var(--danger);box-shadow:0 2px 8px rgba(229,57,53,0.3)}
.btn-full{width:100%}
.btn-small{padding:4px 8px;font-size:10px}
.btn:disabled{opacity:0.4}

/* ====== ТЕГИ ====== */
.boost-tag {
  display: inline-block;
  background: rgba(33,150,243,0.2);
  color: #64b5f6;
  font-size: 8px;
  padding: 1px 6px;
  border-radius: 8px;
  margin-left: 2px;
}
.boost-tag.fert{background:rgba(255,179,0,0.2);color:#ffb300}
.boost-tag.sick{background:rgba(229,57,53,0.3);color:#ef5350;animation:blink 0.8s infinite}

/* ====== ПРЕДУПРЕЖДЕНИЕ О ВРЕДИТЕЛЯХ ====== */
.disease-warning {
  background: rgba(229,57,53,0.15);
  border-radius: 8px;
  padding: 3px 8px;
  margin: 4px 0;
  font-size: 10px;
  color: #ef5350;
  border: 1px solid rgba(229,57,53,0.3);
  z-index: 1;
  position: relative;
  animation: blink 1s infinite;
}

/* ====== ОСТАЛЬНЫЕ СТИЛИ ====== */
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
.pot.ready{border-color:var(--accent);box-shadow:0 0 30px rgba(76,175,80,0.15)}
.pot.needs-water{border-color:var(--blue)}
.pot.sick{border-color:var(--danger);animation:shake 0.4s ease-in-out infinite alternate}
@keyframes shake{0%{transform:translateX(-1px)}100%{transform:translateX(1px)}}

.empty{text-align:center;padding:30px 12px;color:var(--hint)}
.empty-emoji{font-size:40px;margin-bottom:8px}
.level-badge{background:var(--purple);color:#fff;font-size:11px;padding:3px 10px;border-radius:12px;font-weight:700}
.inv-count{background:var(--accent);color:#fff;font-size:9px;font-weight:700;padding:1px 8px;border-radius:10px;margin-left:4px}

/* ====== КАРТОЧКИ ====== */
.card{background:rgba(26,46,26,0.8);backdrop-filter:blur(4px);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,0.05)}
.card-emoji{font-size:26px;width:36px;text-align:center}
.card-info{flex:1;min-width:0}
.card-title{font-weight:600;font-size:13px}
.card-desc{font-size:11px;color:var(--hint)}

/* ====== МОДАЛКИ ====== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:flex-end;justify-content:center;z-index:200;padding:12px}
.modal-overlay.show{display:flex}
.modal{background:var(--secondary);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px;border-top:1px solid rgba(76,175,80,0.2)}
.modal-title{font-size:17px;font-weight:700;margin-bottom:14px;text-align:center}

/* ====== ТОСТ ====== */
.toast {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: var(--accent);
  color: #fff;
  padding: 10px 18px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transition: all 0.3s;
  z-index: 300;
  pointer-events: none;
  max-width: 90%;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--danger)}

/* ====== КЛИЕНТ ====== */
.customer-banner {
  background: linear-gradient(135deg, #1a237e, #283593);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 14px;
  display: none;
  border: 1px solid rgba(255,255,255,0.1);
}
.customer-banner.show{display:block}
.customer-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.customer-avatar{font-size:34px}
.customer-name{font-weight:700;font-size:15px}
.customer-want{font-size:12px;color:rgba(255,255,255,0.75)}
.customer-actions{display:flex;gap:6px;margin-top:8px}
.customer-actions .btn{flex:1}

/* ====== КОМНАТА ====== */
.room-info{background:rgba(26,46,26,0.8);border-radius:14px;padding:14px;margin-bottom:12px;font-size:13px;border:1px solid rgba(255,255,255,0.05)}

/* ====== РЕФЕРАЛКА ====== */
.ref-card{background:linear-gradient(135deg,#1a237e,#283593);border-radius:16px;padding:16px;text-align:center}

.section-title{font-size:11px;font-weight:600;color:var(--hint);margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.5px}

/* ====== АДАПТИВ ====== */
@media (max-width: 400px) {
  .farm-grid{grid-template-columns:1fr}
  .stats{font-size:11px;gap:6px}
  .stat{padding:2px 8px}
  .plant-container{height:90px}
  .plant-container svg{width:70px;height:90px}
}
</style>
</head>
<body>

<!-- ====== ХЕДЕР ====== -->
<div class="header">
  <div class="stats">
    <div class="stat">💰 <span id="money">0</span>$</div>
    <div class="stat">⚡ <span id="energy">100</span></div>
    <div class="stat">🏆 <span id="level">1</span></div>
    <div class="stat">⭐ <span id="rep">0</span></div>
  </div>
  <div class="level-badge" id="xp-badge">0 XP</div>
</div>

<!-- ====== ТАБЫ ====== -->
<div class="tabs">
  <div class="tab active" data-tab="farm">🌱 Ферма</div>
  <div class="tab" data-tab="shop">🛒 Магазин</div>
  <div class="tab" data-tab="inventory">📦 Склад</div>
  <div class="tab" data-tab="room">🏠 Комната</div>
  <div class="tab" data-tab="process">⚗️ Цех</div>
  <div class="tab" data-tab="friends">👥 Друзья</div>
</div>

<!-- ====== КОНТЕНТ ====== -->
<div class="content">

  <!-- ФЕРМА -->
  <div class="section active" id="section-farm">
    <div class="customer-banner" id="customer-banner">
      <div class="customer-header">
        <div class="customer-avatar" id="cust-avatar">🧑</div>
        <div>
          <div class="customer-name" id="cust-name">Клиент</div>
          <div class="customer-want" id="cust-want">Хочет купить...</div>
        </div>
      </div>
      <div class="customer-actions">
        <button class="btn btn-secondary btn-small" onclick="rejectCustomer()">Отказать</button>
        <button class="btn btn-purple btn-small" onclick="smokeWithCustomer()">🚬 Покурить</button>
        <button class="btn btn-small" onclick="dealWithCustomer()">💰 Продать</button>
      </div>
    </div>
    <div class="farm-grid" id="farm-grid"></div>
    <div style="margin-top:12px;text-align:center">
      <button class="btn btn-secondary btn-full" id="btn-buy-pot" onclick="buyPot()">➕ Купить горшок</button>
    </div>
  </div>

  <!-- МАГАЗИН -->
  <div class="section" id="section-shop">
    <div class="card-list" id="shop-list"></div>
  </div>

  <!-- СКЛАД -->
  <div class="section" id="section-inventory">
    <div class="card-list" id="inventory-list"></div>
    <div style="margin-top:14px">
      <button class="btn btn-full" onclick="sellAll()" id="btn-sell-all">💰 Продать всё</button>
    </div>
  </div>

  <!-- КОМНАТА -->
  <div class="section" id="section-room">
    <div class="room-info" id="room-info"></div>
    <div id="daily-box"></div>
    <div class="card-list" id="room-list"></div>
  </div>

  <!-- ЦЕХ -->
  <div class="section" id="section-process">
    <div class="section-title">Переработка сырья</div>
    <div class="card-list" id="process-list"></div>
    <div class="section-title" style="margin-top:14px">Готовая продукция</div>
    <div class="card-list" id="products-list"></div>
  </div>

  <!-- ДРУЗЬЯ -->
  <div class="section" id="section-friends">
    <div class="ref-card">
      <div style="font-weight:700;margin-bottom:6px">👥 Пригласи друзей</div>
      <div style="font-size:12px;color:rgba(255,255,255,0.75);margin-bottom:10px">
        За каждого: <b>+150$</b> и <b>+20⚡</b>
      </div>
      <div style="display:flex;justify-content:center;gap:16px;margin-bottom:10px;font-size:13px">
        <div>Приглашено: <b id="ref-count">0</b></div>
        <div>Бонус: <b id="ref-earned">0</b>$</div>
      </div>
      <button class="btn btn-full" onclick="shareReferral()">📤 Поделиться</button>
      <button class="btn btn-secondary btn-full" style="margin-top:6px" onclick="copyReferral()">📋 Скопировать</button>
    </div>
  </div>

</div>

<!-- ====== МОДАЛКИ ====== -->
<div class="modal-overlay" id="modal-seed">
  <div class="modal">
    <div class="modal-title">Выбери семя</div>
    <div class="card-list" id="seed-list"></div>
    <button class="btn btn-secondary btn-full" style="margin-top:10px" onclick="closeModal('modal-seed')">Отмена</button>
  </div>
</div>

<div class="modal-overlay" id="modal-fert">
  <div class="modal">
    <div class="modal-title">Удобрения / Лечение</div>
    <div class="card-list" id="fert-list"></div>
    <button class="btn btn-secondary btn-full" style="margin-top:10px" onclick="closeModal('modal-fert')">Отмена</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// ====== ВСЯ ЛОГИКА ИГРЫ (ОСТАЁТСЯ БЕЗ ИЗМЕНЕНИЙ) ======
// ============================================================

// ... ВСТАВЬТЕ СЮДА ВЕСЬ JS КОД ИЗ ПРЕДЫДУЩЕЙ ВЕРСИИ ...
// (он полностью рабочий, я его не меняю)

// ============================================================
// ====== НОВАЯ ФУНКЦИЯ: ОТРИСОВКА РАСТЕНИЙ В SVG ======
// ============================================================

function getPlantSVG(strainId, stage, health, disease, ready) {
  const colors = {
    skunk: { leaf: '#4caf50', dark: '#2e7d32', flower: '#8bc34a' },
    haze: { leaf: '#7b1fa2', dark: '#4a148c', flower: '#ce93d8' },
    widow: { leaf: '#e8f5e9', dark: '#a5d6a7', flower: '#ffffff' },
    alien: { leaf: '#00bcd4', dark: '#006064', flower: '#4dd0e1' },
    og: { leaf: '#f57c00', dark: '#e65100', flower: '#ffcc80' }
  };
  const c = colors[strainId] || colors.skunk;
  const healthFactor = health / 100;
  const isSick = disease;
  
  let svg = '';
  const s = stage || 0;
  
  // СТАДИЯ 1: СЕМЯ
  if (s === 1) {
    svg = `
      <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="50" cy="95" rx="30" ry="10" fill="#3e2723" opacity="0.3"/>
        <ellipse cx="50" cy="90" rx="10" ry="6" fill="#5d4037"/>
        <ellipse cx="50" cy="85" rx="6" ry="8" fill="#4caf50" opacity="0.4"/>
        <circle cx="50" cy="80" r="4" fill="${c.leaf}" opacity="0.8"/>
        <circle cx="47" cy="78" r="3" fill="${c.dark}" opacity="0.5"/>
      </svg>
    `;
  }
  // СТАДИЯ 2: РОСТОК
  else if (s === 2) {
    svg = `
      <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="50" cy="100" rx="32" ry="10" fill="#3e2723" opacity="0.3"/>
        <line x1="50" y1="95" x2="50" y2="60" stroke="${c.dark}" stroke-width="3" opacity="${healthFactor}"/>
        <path d="M50 60 Q35 55 30 70 Q40 65 50 60" fill="${c.leaf}" opacity="${healthFactor * 0.8}"/>
        <path d="M50 60 Q65 55 70 70 Q60 65 50 60" fill="${c.leaf}" opacity="${healthFactor * 0.8}"/>
        ${isSick ? `<circle cx="50" cy="70" r="12" fill="none" stroke="#e53935" stroke-width="2" opacity="0.6"><animate attributeName="r" from="10" to="14" dur="0.8s" repeatCount="indefinite"/></circle>` : ''}
      </svg>
    `;
  }
  // СТАДИЯ 3: ВЕГЕТАЦИЯ
  else if (s === 3) {
    svg = `
      <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="50" cy="105" rx="34" ry="10" fill="#3e2723" opacity="0.3"/>
        <line x1="50" y1="100" x2="50" y2="45" stroke="${c.dark}" stroke-width="4" opacity="${healthFactor}"/>
        <path d="M50 55 Q30 45 20 65 Q35 55 50 55" fill="${c.leaf}" opacity="${healthFactor * 0.8}"/>
        <path d="M50 55 Q70 45 80 65 Q65 55 50 55" fill="${c.leaf}" opacity="${healthFactor * 0.8}"/>
        <path d="M50 45 Q35 35 28 50 Q40 42 50 45" fill="${c.dark}" opacity="${healthFactor * 0.6}"/>
        <path d="M50 45 Q65 35 72 50 Q60 42 50 45" fill="${c.dark}" opacity="${healthFactor * 0.6}"/>
        <path d="M50 70 Q40 65 35 78 Q45 72 50 70" fill="${c.leaf}" opacity="${healthFactor * 0.5}"/>
        <path d="M50 70 Q60 65 65 78 Q55 72 50 70" fill="${c.leaf}" opacity="${healthFactor * 0.5}"/>
        ${isSick ? `<circle cx="50" cy="65" r="14" fill="none" stroke="#e53935" stroke-width="2" opacity="0.5"><animate attributeName="r" from="12" to="16" dur="0.8s" repeatCount="indefinite"/></circle>` : ''}
      </svg>
    `;
  }
  // СТАДИЯ 4: ЦВЕТЕНИЕ
  else if (s === 4) {
    svg = `
      <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="50" cy="108" rx="36" ry="10" fill="#3e2723" opacity="0.3"/>
        <line x1="50" y1="103" x2="50" y2="35" stroke="${c.dark}" stroke-width="5" opacity="${healthFactor}"/>
        <!-- Ветки -->
        <path d="M50 50 Q30 35 18 55 Q32 48 50 50" fill="${c.leaf}" opacity="${healthFactor * 0.7}"/>
        <path d="M50 50 Q70 35 82 55 Q68 48 50 50" fill="${c.leaf}" opacity="${healthFactor * 0.7}"/>
        <path d="M50 65 Q35 55 25 72 Q38 65 50 65" fill="${c.leaf}" opacity="${healthFactor * 0.6}"/>
        <path d="M50 65 Q65 55 75 72 Q62 65 50 65" fill="${c.leaf}" opacity="${healthFactor * 0.6}"/>
        <path d="M50 80 Q40 75 35 88 Q45 82 50 80" fill="${c.leaf}" opacity="${healthFactor * 0.5}"/>
        <path d="M50 80 Q60 75 65 88 Q55 82 50 80" fill="${c.leaf}" opacity="${healthFactor * 0.5}"/>
        <!-- ЦВЕТЫ -->
        <circle cx="50" cy="40" r="12" fill="${c.flower}" opacity="${healthFactor * 0.6}"/>
        <circle cx="50" cy="40" r="6" fill="${c.leaf}" opacity="${healthFactor * 0.4}"/>
        <circle cx="35" cy="50" r="8" fill="${c.flower}" opacity="${healthFactor * 0.5}"/>
        <circle cx="65" cy="50" r="8" fill="${c.flower}" opacity="${healthFactor * 0.5}"/>
        <circle cx="30" cy="68" r="6" fill="${c.flower}" opacity="${healthFactor * 0.4}"/>
        <circle cx="70" cy="68" r="6" fill="${c.flower}" opacity="${healthFactor * 0.4}"/>
        ${isSick ? `<circle cx="50" cy="65" r="18" fill="none" stroke="#e53935" stroke-width="2" opacity="0.5"><animate attributeName="r" from="15" to="20" dur="0.8s" repeatCount="indefinite"/></circle>` : ''}
      </svg>
    `;
  }
  // СТАДИЯ 5: ГОТОВО (урожай)
  else if (s === 5) {
    svg = `
      <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="50" cy="108" rx="38" ry="10" fill="#3e2723" opacity="0.3"/>
        <line x1="50" y1="103" x2="50" y2="30" stroke="${c.dark}" stroke-width="5" opacity="${healthFactor}"/>
        <path d="M50 45 Q25 30 15 55 Q32 45 50 45" fill="${c.leaf}" opacity="${healthFactor * 0.6}"/>
        <path d="M50 45 Q75 30 85 55 Q68 45 50 45" fill="${c.leaf}" opacity="${healthFactor * 0.6}"/>
        <path d="M50 60 Q30 48 20 70 Q38 60 50 60" fill="${c.leaf}" opacity="${healthFactor * 0.5}"/>
        <path d="M50 60 Q70 48 80 70 Q62 60 50 60" fill="${c.leaf}" opacity="${healthFactor * 0.5}"/>
        <!-- БОЛЬШИЕ ЦВЕТЫ / ШИШКИ -->
        <circle cx="50" cy="35" r="16" fill="${c.flower}" opacity="${healthFactor * 0.7}" filter="url(#glow)"/>
        <circle cx="50" cy="35" r="8" fill="${c.leaf}" opacity="0.5"/>
        <circle cx="30" cy="50" r="10" fill="${c.flower}" opacity="${healthFactor * 0.6}"/>
        <circle cx="70" cy="50" r="10" fill="${c.flower}" opacity="${healthFactor * 0.6}"/>
        <circle cx="25" cy="70" r="8" fill="${c.flower}" opacity="${healthFactor * 0.5}"/>
        <circle cx="75" cy="70" r="8" fill="${c.flower}" opacity="${healthFactor * 0.5}"/>
        <circle cx="42" cy="55" r="7" fill="${c.flower}" opacity="${healthFactor * 0.4}"/>
        <circle cx="58" cy="55" r="7" fill="${c.flower}" opacity="${healthFactor * 0.4}"/>
        <!-- ЗВЁЗДОЧКИ ГОТОВНОСТИ -->
        ${ready ? `<text x="50" y="20" font-size="16" text-anchor="middle" fill="#ffd700">✨</text>` : ''}
        <defs>
          <filter id="glow">
            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="${c.flower}" flood-opacity="0.6"/>
          </filter>
        </defs>
        ${isSick ? `<circle cx="50" cy="65" r="22" fill="none" stroke="#e53935" stroke-width="2" opacity="0.4"><animate attributeName="r" from="18" to="24" dur="0.8s" repeatCount="indefinite"/></circle>` : ''}
      </svg>
    `;
  }
  
  return svg;
}
